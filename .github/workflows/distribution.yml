name: Build distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Package extension
        id: package
        shell: bash
        run: |
          safe_ref_name="${GITHUB_REF_NAME//\//-}"
          archive_name="calendar-bulk-select-${safe_ref_name}.zip"
          (cd dist && zip -r "../${archive_name}" .)
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: calendar-bulk-select-${{ github.run_number }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

      - name: Attach distribution to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.archive_name }}
          generate_release_notes: true
